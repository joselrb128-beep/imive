.ckItems{transition:transform .1s}

.ckTool svg{width:100%;height:100%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}

.ing{background:linear-gradient(180deg,#fff,#f4eeff);border:2px solid #e3d9f6;border-radius:16px;padding:6px 11px;font-weight:800;font-size:15px;color:#2b2340;box-shadow:0 3px 0 #d6c9f2;display:flex;align-items:center;gap:5px}

:root{--lilac:#f3e6cf;--woodE:#4a2a14;--parch:#fff8ea;--parch2:#f5e3c3;
 --woodBg:repeating-linear-gradient(97deg,rgba(255,240,210,.09) 0 2px,rgba(0,0,0,0) 2px 8px,rgba(70,35,10,.10) 8px 10px,rgba(0,0,0,0) 10px 17px),radial-gradient(120% 95% at 30% 18%,#eab97f 0%,#c98745 55%,#9c5d2c 100%);
 --woodDark:repeating-linear-gradient(97deg,rgba(255,240,210,.07) 0 2px,rgba(0,0,0,0) 2px 8px,rgba(0,0,0,.12) 8px 10px,rgba(0,0,0,0) 10px 17px),radial-gradient(120% 95% at 30% 18%,#b9773f 0%,#8a522a 55%,#5e3418 100%);
 --woodLight:repeating-linear-gradient(97deg,rgba(255,255,255,.12) 0 2px,rgba(0,0,0,0) 2px 8px,rgba(120,70,20,.08) 8px 10px,rgba(0,0,0,0) 10px 17px),radial-gradient(120% 95% at 30% 18%,#ffe0a6 0%,#f0b862 55%,#cf8a3a 100%);
 --woodShadow:inset 0 3px 0 rgba(255,232,190,.55),inset 0 -4px 0 rgba(70,35,10,.32),0 4px 0 #3e2310,0 8px 12px rgba(40,20,5,.28);
 --outline:-1.5px 0 #4a2a14,1.5px 0 #4a2a14,0 -1.5px #4a2a14,0 2px #4a2a14,1px 1px #4a2a14,-1px 1px #4a2a14}

 box-shadow:inset 0 0 0 3px #f3c98d,inset 0 0 0 4.5px #8a5226,inset 0 7px 8px rgba(255,235,200,.22),0 3px 0 #2e1a0b,0 6px 10px rgba(30,15,5,.25);text-shadow:none}

.pg .jb{background:var(--grain),var(--faceLight);color:#6b3d1c;text-shadow:0 1px 0 #fff;border-radius:22px;box-shadow:inset 0 0 0 2px #fff4d8,0 4px 0 #5a3317,0 8px 14px rgba(30,15,5,.3)}

.coins{background:var(--grain),var(--faceLight);color:#6b3d1c;text-shadow:0 1px 0 #fff;border:2px solid #5a3317;box-shadow:inset 0 0 0 2px #fff4d8,0 3px 0 #5a3317}
.room-name{background:var(--grain),var(--faceDark);border:2px solid #3e2310;text-shadow:0 1px 0 #2e1a0b;box-shadow:inset 0 0 0 1.5px rgba(236,190,135,.5),0 3px 0 #3e2310}

.item .pr.own{background:linear-gradient(#9fd88a,#5ea64a);color:#fff;text-shadow:0 1px 0 #2c5a1f;border-color:#2c5a1f;box-shadow:0 2px 0 #2c5a1f}
.toast{text-shadow:none}
.sponge{background:var(--grain),var(--faceLight);text-shadow:none;border:2px solid #5a3317}
.bigtap{background:var(--grain),radial-gradient(circle at 45% 32%,#fff0c4,#f3b862 62%,#d68b3a);border:3px solid #5a3317;box-shadow:inset 0 0 0 4px #fff4d8,0 5px 0 #5a3317,0 10px 16px rgba(30,15,5,.25)}
.item .tier{position:absolute;top:5px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:800;color:#fff;padding:0 7px;border-radius:8px;letter-spacing:.3px;white-space:nowrap}
.item.pt-l{background:linear-gradient(180deg,#fffbe8,#ffe9b0);border-color:#e09a1a}
.item.pt-e{background:linear-gradient(180deg,#fdf6ff,#efdcff);border-color:#9b4dd8}
.item.pt-r{background:linear-gradient(180deg,#f6fbff,#dcecff);border-color:#3a7bd5}

.pet.big{width:34%;max-width:150px}
/* ====== v8: armario, perfume, juntos, juegos nuevos ====== */
.chips.sty{margin-top:-2px}
.stc{background:#fff8ea;border:2px solid #c98745;color:#6b3d1c;border-radius:12px;padding:3px 11px;font-weight:800;font-size:13px;white-space:nowrap}
.stc.on{background:#6b3d1c;color:#fff3dc;border-color:#4a2a14}
.item .stag{display:inline-block;font-size:10px;font-weight:800;border-radius:8px;padding:0 6px;margin:2px 0 1px;color:#fff}
.s-casual{background:#3a7bd5}.s-salir{background:#4a2a14}.s-pijama{background:#8a5ad0}.s-deporte{background:#2fa37a}.s-playa{background:#f28c38}.s-fiesta{background:#e2425a}
.pbottle{position:absolute;width:34px;height:52px;z-index:7;pointer-events:none;animation:pb 1.6s ease forwards}
.pbottle svg{width:100%;height:100%}
@keyframes pb{0%{opacity:0;transform:translateY(12px) rotate(10deg)}15%{opacity:1;transform:rotate(-8deg)}22%{transform:rotate(-8deg) scale(.9,1.06)}30%{transform:rotate(-8deg)}85%{opacity:1}100%{opacity:0;transform:translateY(-6px) rotate(-8deg)}}
.mist{position:absolute;border-radius:50%;background:rgba(255,226,242,.95);box-shadow:0 0 5px 1px rgba(255,255,255,.9);z-index:7;pointer-events:none;opacity:0;animation:mist 1.15s ease-out forwards}
@keyframes mist{0%{opacity:0;transform:translate(0,0)}12%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.7)}}
.vapor{position:absolute;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle,rgba(255,205,232,.8),rgba(225,205,255,.4) 55%,transparent 72%);filter:blur(3px);z-index:6;pointer-events:none;opacity:0;animation:vap 2.5s ease-out forwards}
@keyframes vap{0%{opacity:0;transform:scale(.4)}25%{opacity:.95}100%{opacity:0;transform:translateY(-80px) scale(2.3)}}
.gmas.date{width:104px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
.gmas.date#gmJ{left:calc(50% - 108px)}
.gmas.gh.date{right:calc(50% - 108px)}
.dtitle{background:linear-gradient(#fffaf0,#f6e7cf);border:3px solid #a2622f;border-radius:16px;padding:4px 16px;font-weight:800;font-size:19px;color:#4a2a14;box-shadow:0 3px 0 #4a2a14;text-align:center}
.dstage{position:relative;width:min(92vw,400px);height:min(36vh,300px);margin:12px 0 6px}
.dmsg{min-height:26px;background:rgba(255,250,240,.92);color:#4a2a14;font-weight:800;font-size:15px;border-radius:12px;padding:4px 12px;text-align:center;max-width:92vw}
.dmsg:empty{visibility:hidden}
.dact{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(94vw,420px);margin-top:10px;margin-bottom:120px}
.dact .btn{flex:1 1 44%;min-width:0;font-size:15px}
.tgt{position:absolute;font-size:44px;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.35);border:2px dashed rgba(255,255,255,.8);animation:tgtin .3s ease,petbob 1.2s ease-in-out .3s infinite;display:flex;align-items:center;justify-content:center;padding:0}
@keyframes tgtin{from{transform:scale(0)}}
.hold{width:100%;display:flex;flex-direction:column;gap:8px;align-items:center}
.hold .btn{width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.hbar{width:100%;height:14px;border-radius:8px;background:rgba(255,255,255,.7);overflow:hidden;border:2px solid #8a5a2c}
.hbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb8d9,#ef8fbf)}
.popfx{position:absolute;bottom:200px;font-size:30px;pointer-events:none;animation:rise 1s ease-out forwards;z-index:3}
.flash{position:absolute;top:0;right:0;bottom:0;left:0;background:#fff;z-index:20;animation:fl .4s ease forwards;pointer-events:none}
@keyframes fl{from{opacity:1}to{opacity:0}}
.tv{position:absolute;left:8%;right:8%;top:0;height:72%;background:#26262b;border-radius:12px;border:6px solid #3a3a44;box-shadow:0 6px 0 #1a1a1f}
.tvscreen{position:absolute;top:6px;right:6px;bottom:6px;left:6px;border-radius:6px;background:radial-gradient(circle at 50% 40%,#5b4aa8,#1d1238);overflow:hidden}
.tvfx{position:absolute;font-size:34px;animation:tvf 1.6s ease forwards}
@keyframes tvf{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:translateY(-30px) scale(1)}}
.sofa{position:absolute;left:5%;right:5%;bottom:0;height:24%;background:linear-gradient(#e06a88,#c8506e);border-radius:22px 22px 10px 10px;border:3px solid #8a2a44}
.sky{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:20px;background:linear-gradient(#8fd8ff,#d6f2ff);transition:background 1s;overflow:hidden}
.sky.night{background:radial-gradient(circle at 20% 30%,#fff 1px,transparent 2px) 0 0/34px 34px,linear-gradient(#120c33,#3b2a7a)}
.shoot{position:absolute;left:-10%;top:10%;font-size:40px;animation:shoot 1.6s ease-in forwards}
@keyframes shoot{to{left:110%;top:60%}}
.c4wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:110px}
.c4turn{background:linear-gradient(#fffaf0,#f6e7cf);border:3px solid #a2622f;border-radius:14px;padding:4px 14px;font-weight:800;color:#4a2a14}
.c4turn .t1{color:#2f5fd0}.c4turn .t2{color:#d9407f}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:min(94vw,400px);padding:8px;border-radius:18px;background:var(--grain),var(--face);border:3px solid #4a2a14;box-shadow:inset 0 0 0 3px #f3c98d,0 5px 0 #3e2310}
.c4c{aspect-ratio:1;border-radius:50%;background:#4a2a14;box-shadow:inset 0 3px 5px rgba(0,0,0,.6);position:relative;overflow:hidden;cursor:pointer}
.c4c .pc{position:absolute;top:3px;right:3px;bottom:3px;left:3px;border-radius:50%;transition:transform .35s cubic-bezier(.4,1.4,.6,1)}
.pc.p1{background:radial-gradient(circle at 35% 30%,#9cc4f0,#2f5fd0 70%)}
.pc.p2{background:radial-gradient(circle at 35% 30%,#ffc4dc,#d9407f 70%)}
.dboard{display:grid;grid-template-columns:repeat(8,1fr);width:min(94vw,400px);border:6px solid #4a2a14;border-radius:10px;overflow:hidden;box-shadow:0 5px 0 #3e2310}
.dq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative}
.dq.lt{background:#f3dfb8}.dq.dk{background:#a8743f}
.dq.sel{background:#f2c230}.dq.hint::after{content:"";width:34%;height:34%;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 0 3px #2fa37a}
.dp{width:78%;height:78%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.2)}
.dp.p1{background:radial-gradient(circle at 35% 30%,#9cc4f0,#2f5fd0 70%);border:2px solid #1f3f8f}
.dp.p2{background:radial-gradient(circle at 35% 30%,#ffc4dc,#d9407f 70%);border:2px solid #8a2050}
.pg button.big{width:86px;height:86px}
.pg button.big svg{width:40px;height:40px}

/* ====== v9 ====== */
.decor.floaty svg{animation:floaty 3s ease-in-out infinite;transform-origin:50% 0}
@keyframes floaty{50%{transform:rotate(3deg) translateY(2px)}}
.decor.led{filter:saturate(1.4);animation:led 3s linear infinite}
@keyframes led{to{filter:hue-rotate(360deg) saturate(1.4)}}
.thought{position:absolute;left:61%;top:7%;z-index:8;width:52px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 3px 0 rgba(0,0,0,.12);opacity:0;transform:scale(.4);transition:all .3s;pointer-events:none}
.thought::before{content:"";position:absolute;left:2px;bottom:-8px;width:12px;height:12px;border-radius:50%;background:#fff}
.thought::after{content:"";position:absolute;left:-6px;bottom:-16px;width:7px;height:7px;border-radius:50%;background:#fff}
.thought.show{opacity:1;transform:scale(1);animation:think 1.6s ease-in-out infinite}
@keyframes think{50%{transform:translateY(-4px) scale(1.05)}}
.flies{position:absolute;left:50%;top:12%;width:0;height:0;z-index:8;pointer-events:none;display:none}
.flies.show{display:block}
.flies i{position:absolute;font-style:normal;font-size:16px;animation:fly1 2.4s linear infinite}
.flies i:nth-child(2){animation:fly2 3s linear infinite}
.flies i:nth-child(3){animation:fly1 2s linear infinite reverse;animation-delay:-.7s}
@keyframes fly1{0%{transform:rotate(0) translateX(46px) rotate(0)}100%{transform:rotate(360deg) translateX(46px) rotate(-360deg)}}
@keyframes fly2{0%{transform:rotate(0) translateX(30px) translateY(20px)}100%{transform:rotate(-360deg) translateX(30px) translateY(20px)}}

/* ====== v10 cocina viva y comer por bocados ====== */
.stove{position:absolute;left:22%;right:22%;bottom:-6%;display:flex;justify-content:space-around;z-index:-1;pointer-events:none}
.stove i{font-style:normal;font-size:clamp(18px,6vw,28px);animation:flick .25s ease-in-out infinite alternate;transform-origin:50% 100%;line-height:1}
.stove i:nth-child(2n){animation-duration:.33s}
@keyframes flick{from{transform:scaleY(.82)}to{transform:scaleY(1.15) translateY(-2px)}}
.steam,.msteam{position:absolute;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);filter:blur(2px);pointer-events:none;animation:steam 1.8s ease-out forwards;z-index:3}
@keyframes steam{0%{opacity:0;transform:translate(-50%,0) scale(.5)}20%{opacity:.9}100%{opacity:0;transform:translate(-50%,-90px) scale(2.3)}}
.spl,.cdrop{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd66b;box-shadow:0 0 4px #fff3b0;animation:spl .55s ease-out forwards;pointer-events:none;z-index:3}
@keyframes spl{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.salt{position:absolute;width:5px;height:5px;border-radius:50%;animation:salt .9s ease-in forwards;pointer-events:none;box-shadow:0 0 2px rgba(0,0,0,.3);z-index:3}
@keyframes salt{to{transform:translate(var(--dx),var(--dy));opacity:.25}}
.aroma{position:absolute;font-size:28px;animation:aroma 1.6s ease-out forwards;pointer-events:none;z-index:3}
@keyframes aroma{0%{opacity:0;transform:translate(-50%,0)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-70px)}}
.pourer{position:absolute;right:4%;top:-6%;font-size:clamp(40px,13vw,64px);transform-origin:70% 80%;transition:transform .3s;z-index:4;line-height:1}

.stream{position:absolute;left:57%;top:12%;width:9px;height:0;border-radius:5px;z-index:3;transition:height .25s;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.stream.on{height:40%}
.flipb{flex:0 0 100%!important;animation:pulse .55s ease-in-out infinite alternate;background:var(--grain),linear-gradient(180deg,#ffb8d9,#ef8fbf 50%,#d9659f)!important}
@keyframes pulse{to{transform:scale(1.05)}}
.ckItems.flipit{animation:flipit .6s ease}
@keyframes flipit{50%{transform:translateY(-14%) rotateX(180deg) scale(1.06)}}
#ckSauce{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;pointer-events:none}
.meal{position:absolute;left:50%;bottom:2%;width:40%;max-width:175px;transform:translateX(-50%);z-index:7;animation:mealin .45s cubic-bezier(.3,1.5,.6,1)}
@keyframes mealin{from{transform:translate(-50%,40%) scale(.5);opacity:0}}
.meal.bye{animation:mealout .5s ease forwards}
@keyframes mealout{to{transform:translate(-50%,30%) scale(.6);opacity:0}}
.mtable{position:absolute;left:-14%;right:-14%;bottom:-3%;height:30%;border-radius:50%;background:var(--grain),radial-gradient(ellipse at 50% 30%,#e8ad6c,#a5652f);border:3px solid #4a2a14;box-shadow:0 4px 0 #3e2310}
.mplate{position:relative;width:100%;aspect-ratio:1;cursor:pointer;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25));transition:transform .12s}
.mplate:active{transform:scale(.95)}
.mplate svg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}
.memoji{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;font-size:clamp(54px,18vw,84px);transition:transform .35s;line-height:1}
.mcount{position:absolute;left:50%;top:-32px;transform:translateX(-50%);white-space:nowrap;background:#fffaf0;border:2px solid #8a5a2c;color:#4a2a14;font-weight:800;font-size:12.5px;padding:2px 10px;border-radius:12px;animation:mcb 1.6s ease-in-out infinite;z-index:2}
@keyframes mcb{50%{transform:translate(-50%,-3px)}}
.crumb{position:absolute;width:5px;height:5px;border-radius:2px;background:#d9a066;z-index:8;pointer-events:none;animation:crumb .8s ease-in forwards}
@keyframes crumb{to{transform:translate(var(--dx),70px) rotate(200deg);opacity:0}}

/* ====== v11 baño y técnicas ====== */
.shelf{position:absolute;left:70%;top:50%;width:28%;height:13%;pointer-events:none;z-index:2}
.shelf-board{position:absolute;left:0;right:0;bottom:0;height:16%;background:var(--grain),linear-gradient(#c98745,#8a5226);border:2px solid #4a2a14;border-radius:4px}

.pieces{display:flex;flex-wrap:wrap;gap:6px;margin:0 4px 6px}

.dtool{display:inline-flex;width:72px;height:72px;align-items:center;justify-content:center;border-radius:18px;background:var(--grain),var(--faceLight);border:2px solid #5a3317;box-shadow:inset 0 0 0 2px #fff4d8,0 3px 0 #5a3317;touch-action:none;cursor:grab}
.dtool svg{width:54px;height:54px}
.tool-ghost{transition:none!important}
.dlbl{font-size:12px;font-weight:800;color:#6b3d1c;margin:2px 0}
.wind{position:fixed;width:16px;height:4px;border-radius:2px;background:rgba(255,255,255,.95);box-shadow:0 0 3px #9fd3f5;pointer-events:none;z-index:51;animation:wind .5s ease-out forwards}

.tov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:45;background:rgba(30,15,10,.6);display:flex;align-items:center;justify-content:center;padding:16px;touch-action:none}
.tcard{background:linear-gradient(#fffaf0,#f6e6c9);border:6px solid #a2622f;border-radius:24px;box-shadow:0 0 0 3px #4a2a14;padding:14px;width:min(94vw,420px);text-align:center;color:#4a2a14}
.ttl{font-weight:800;font-size:20px;margin-bottom:6px}
.tmouth{touch-action:none;cursor:none}
.tmouth svg{width:100%;height:auto;display:block}
.tmsg{font-weight:800;margin:8px 0}
.tbrush{position:fixed;left:-200px;top:-200px;pointer-events:none;z-index:46;transform-origin:8px 14px}
.tbrush.scrub svg{animation:scrub .12s linear infinite alternate}
@keyframes scrub{to{transform:translateX(6px)}}
.spk{animation:tgtin .4s ease both}
.flambe{position:absolute;transform:translate(-50%,-50%);animation:flb 1.2s ease-out forwards;pointer-events:none;z-index:5;line-height:1}
@keyframes flb{0%{opacity:0;transform:translate(-50%,-30%) scale(.3)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90%) scale(.9)}}
.skewer{position:absolute;left:8%;right:8%;top:48%;height:14%;display:flex;align-items:center;justify-content:space-around}
.skewer .stick{position:absolute;left:-4%;right:-4%;top:50%;height:5px;background:#c8915a;border-radius:3px}

.skewer span.next{opacity:.6;filter:none;animation:pulse .5s ease-in-out infinite alternate}
.lstack{position:absolute;left:24%;right:24%;bottom:26%;display:flex;flex-direction:column-reverse;gap:2px}
.lstack i{display:block;height:clamp(10px,3.2vw,15px);border-radius:6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);animation:tgtin .25s ease}

/* ====== pantalla de inicio imive ====== */
#splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 35%,#fff3dc 0,#f6d9b8 45%,#e9b98a 100%);transition:opacity .45s,transform .45s}

.pacc{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
.pacc i{position:absolute;left:50%;transform:translate(-50%,-50%);font-style:normal;line-height:1}
.pa-head{top:13%;font-size:34cqw}.pa-face{top:40%;font-size:28cqw}.pa-neck{top:67%;font-size:24cqw}
.pneed{position:absolute;right:-8%;top:-16%;width:38%;aspect-ratio:1;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22cqw;box-shadow:0 3px 0 rgba(0,0,0,.12);animation:think 1.6s ease-in-out infinite;pointer-events:none}
.phrt{position:absolute;font-size:24px;pointer-events:none;animation:phrt 1.4s ease-out forwards;z-index:9}
@keyframes phrt{from{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}to{transform:translateY(-80px) scale(1.3);opacity:0}}
.phand{position:absolute;left:18%;top:4%;font-size:40cqw;animation:phand .45s ease-in-out 3 alternate;z-index:2;pointer-events:none}
@keyframes phand{to{transform:translateX(35%) rotate(12deg)}}
.pet.stroked svg{animation:squish .5s}
@keyframes squish{50%{transform:scale(1.06,.94)}}
.pet.munch svg{animation:munch .2s ease-in-out 4 alternate}
@keyframes munch{to{transform:scale(1.05,.95) translateY(3%)}}
.pbub{position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(200,230,255,.5));border:1px solid #bfe3ff;animation:pbub .9s ease-out forwards;pointer-events:none}
@keyframes pbub{from{transform:scale(.3)}to{transform:scale(1.2) translateY(-24px);opacity:0}}
.pball{position:absolute;bottom:8%;font-size:30px;z-index:6;transition:left .7s ease-out;pointer-events:none}
.pball.fly{animation:ballarc .7s ease-out}
@keyframes ballarc{50%{transform:translateY(-100px) rotate(180deg)}}
.pcare{background:linear-gradient(#fff8ea,#f6e6c9);border:3px solid #b8763f;border-radius:18px;padding:10px;margin-bottom:6px;color:#4a2a14}
.pc-top{display:flex;gap:12px;align-items:center}
.pc-pic{position:relative;width:96px;height:96px;flex:0 0 auto;container-type:inline-size;animation:petbob 1.6s ease-in-out infinite}
.pc-pic svg{width:100%;height:100%}
.pc-info{flex:1;min-width:0}
.pc-n{font-weight:800;font-size:17px}.pc-n small{font-size:12px;color:#8a5a2c}
.pbar{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:#6b3d1c;margin-top:4px}
.pbar i{height:10px;border-radius:6px;background:#e6dccb;overflow:hidden;border:1.5px solid #8a5a2c}
.pbar b{display:block;height:100%;transition:width .4s}
.pc-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pc-acts .btn{font-size:14px;padding:10px 4px}
.pc-sub{font-weight:800;margin:10px 2px 6px}
html.tablet .pc-acts{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
html.tablet .pc-pic{width:130px;height:130px}
html.tablet .pbar{font-size:14px;grid-template-columns:110px 1fr}
#gpad.farmbar{justify-content:center;gap:10px;flex-wrap:wrap}
#gpad.farmbar .btn{flex:0 1 auto;font-size:15px;padding:10px 14px}
#gpad.farmbar small{font-size:11px;opacity:.85}
html.tablet #gpad.farmbar .btn{font-size:18px;padding:14px 20px}
.barn .brow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0;font-weight:800}
.barn .btn{font-size:13px;padding:8px 10px}

/* ====== v21 decoración y fluidez ====== */
body:has(#game.show) #app,body:has(#cook.show) #app{visibility:hidden}
body:has(#game.show) #app *,body:has(#cook.show) #app *{animation-play-state:paused!important}
.wprev{display:block;width:64px;height:64px;margin:0 auto 4px}
.wprev.wide{width:120px;height:90px}
.wprev svg{width:100%;height:100%}
.bigphoto svg{width:100%;height:auto;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
html.tablet .wprev{width:84px;height:84px}
html.tablet .wprev.wide{width:170px;height:128px}

.mclose{position:absolute;right:-6px;top:-6px;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:#b8763f;color:#fff;font-weight:900;font-size:14px;z-index:3;padding:0;line-height:1;box-shadow:0 2px 0 rgba(0,0,0,.2)}
html.tablet .mclose{width:38px;height:38px;font-size:17px}

.illcard{display:flex;flex-direction:column;gap:3px;background:linear-gradient(#fff2f2,#ffe0e0);border:3px solid #e2425a;border-radius:16px;padding:10px 12px;margin:4px 0 10px;color:#4a2a14;font-size:13.5px}
.illcard b{font-size:16px}.illcard.ok{background:linear-gradient(#effbf4,#d8f3e4);border-color:#2fa37a}
.illcard .cura{font-weight:800;color:#2f6f3a}
.illtag{position:absolute;left:12px;top:52px;z-index:8;background:#fff;border:2px solid #e2425a;color:#b8263a;font-weight:900;border-radius:14px;padding:4px 10px;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.15);animation:think 1.6s ease-in-out infinite}
html.tablet .illtag{font-size:16px;padding:6px 14px}
html.tablet .illcard{font-size:15.5px}

.updbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9999;background:linear-gradient(#ffd66b,#f2b33d);color:#4a2a14;font-weight:900;border:3px solid #fff;border-radius:18px;padding:12px 18px;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:think 1.6s ease-in-out infinite;max-width:92vw}
@supports not (aspect-ratio:1/1){ .pet{height:auto!important} .pet svg,.pc-pic svg{display:block;width:100%;height:auto} .pneed,.pbub{height:38px} }
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important} }
</style>

  function sanitizeState() {
    const ok = (f) => {

    }, num = (v, d) => typeof v === "number" && isFinite(v) ? v : d, obj = (v) => v && typeof v === "object" && !Array.isArray(v), arr = (v) => Array.isArray(v) ? v : [];

      if (!obj(S.owned)) S.owned = defState().owned;

      if (S.pet && !PETS.some((p) => p.id === S.pet)) S.pet = null;

    ok(() => {
      if (!obj(S.pantry)) S.pantry = {};
      for (const k in S.pantry) {

    ok(() => {
